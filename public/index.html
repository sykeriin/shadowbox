<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shadowbox — Hour 1 plumbing test</title>
<style>
  :root { --bg:#0d0f12; --fg:#e8e6e0; --dim:#7c7f86; --line:#22262c; --hot:#4ade80; --bad:#f87171; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace; padding:24px; }
  h1 { font-size:15px; font-weight:500; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); margin:0 0 4px; }
  p.sub { color:var(--dim); margin:0 0 20px; }
  .wrap { display:grid; grid-template-columns:1fr 1fr; gap:24px; max-width:960px; }
  @media (max-width:760px){ .wrap{ grid-template-columns:1fr; } }
  video { width:100%; border:1px solid var(--line); background:#000; display:block; aspect-ratio:4/3; object-fit:cover; }
  button { font:inherit; background:transparent; color:var(--fg); border:1px solid var(--line); padding:10px 16px; cursor:pointer; width:100%; margin-top:10px; }
  button:hover:not(:disabled) { border-color:var(--hot); color:var(--hot); }
  button:disabled { color:var(--dim); cursor:not-allowed; }
  #log { white-space:pre-wrap; color:var(--dim); font-size:12px; margin-top:16px; max-height:300px; overflow-y:auto; border-top:1px solid var(--line); padding-top:12px; }
  #log .ok { color:var(--hot); }
  #log .err { color:var(--bad); }
  figure { margin:0; }
  figcaption { color:var(--dim); font-size:12px; margin-top:6px; text-transform:uppercase; letter-spacing:.05em; }
</style>
</head>
<body>
<h1>Shadowbox — Hour 1 checkpoint</h1>
<p class="sub">Prove the round trip: your face goes into Reactor, your face (unmodified) comes back out. No prompt, no reference image yet.</p>

<div class="wrap">
  <figure>
    <video id="local" autoplay muted playsinline></video>
    <figcaption>Local webcam</figcaption>
  </figure>
  <figure>
    <video id="remote" autoplay playsinline></video>
    <figcaption>Reactor main_video</figcaption>
  </figure>
</div>

<button id="start" disabled>Loading SDK…</button>
<div id="log"></div>

<script type="module">
  const logEl = document.getElementById('log');
  function log(msg, cls) {
    const line = document.createElement('div');
    if (cls) line.className = cls;
    line.textContent = msg;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
    console.log(msg);
  }

  const localVideo = document.getElementById('local');
  const remoteVideo = document.getElementById('remote');
  const startBtn = document.getElementById('start');

  // ---------------------------------------------------------------------
  // UNVERIFIED SDK SURFACE — read this before debugging anything below.
  //
  // docs.reactor.inc/model-api-reference/x2 describes this shape:
  //   import { X2Model } from "@reactor-models/x2"
  //   const x2 = new X2Model()
  //   await x2.connect(jwt)
  //   await x2.publishSource(track)
  //   x2.onMainVideo((track, stream) => { ... })
  //   await x2.setPrompt({ prompt: "..." })
  //
  // A separate, more generic Reactor overview page described a *different* shape
  // (@reactor-team/js-sdk, reactor.publishTrack, a "trackReceived" event). These two
  // don't agree. The X2-specific page should be authoritative for X2 — but confirm
  // against the live page before spending real time debugging this file. If the
  // import below 404s or the methods don't exist, that mismatch is why.
  //
  // esm.sh is used here to get a browser-importable build without setting up a
  // bundler — untested against this specific package. If it fails to resolve,
  // the fallback is `npm install @reactor-models/x2` + a real bundler (Vite).
  // ---------------------------------------------------------------------
  let X2Model;
  try {
    ({ X2Model } = await import('https://esm.sh/@reactor-models/x2'));
    log('SDK import ok (unverified against live docs — see comment in source)', 'ok');
    startBtn.disabled = false;
    startBtn.textContent = 'Start';
  } catch (err) {
    log('SDK import failed: ' + err.message, 'err');
    log('Check the exact package name / whether a browser build exists at https://docs.reactor.inc/model-api-reference/x2', 'err');
    startBtn.textContent = 'SDK unavailable — see log';
  }

  startBtn.addEventListener('click', async () => {
    startBtn.disabled = true;
    try {
      log('Requesting webcam…');
      const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      localVideo.srcObject = stream;

      log('Requesting JWT from /token…');
      const tokenRes = await fetch('/token', { method: 'POST' });
      const tokenBody = await tokenRes.json();
      if (!tokenRes.ok) throw new Error('Token exchange failed: ' + JSON.stringify(tokenBody));
      log('Got JWT', 'ok');

      log('Connecting to X2…');
      const x2 = new X2Model();
      await x2.connect(tokenBody.jwt);
      log('Connected', 'ok');

      x2.onMainVideo((track, remoteStream) => {
        log('main_video track received', 'ok');
        remoteVideo.srcObject = remoteStream;
      });

      log('Publishing webcam as SOURCE (no prompt set — raw round-trip only)…');
      await x2.publishSource(stream.getVideoTracks()[0]);
      log('Published. Waiting for main_video…');
    } catch (err) {
      log('Failed: ' + err.message, 'err');
      startBtn.disabled = false;
    }
  });
</script>
</body>
</html>
