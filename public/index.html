<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shadowbox — Fighter</title>
<style>
  /* Same two-corner broadcast language as broadcast.html: this page's accent (--corner) is
     the fighter's own corner color — blue corner for A, red corner for B. Display face is
     the condensed-heavy-italic of fight cards (Impact stack, no webfont so a LAN demo with
     no internet still renders it); mono is the utility face. */
  :root {
    --bg:#05060a; --steel:#0d1017; --panel:#131824; --fg:#eef1f6; --dim:#7d8698; --line:#242c3c;
    --corner-a:#3fc1ff; --corner-b:#ff3d6e; --live:#3dffa8; --hit:#ff4d4d;
    --corner:var(--corner-a);
    --display: Impact, Haettenschweiler, "Franklin Gothic Medium", "Arial Narrow Bold", sans-serif;
    --mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
  }
  body[data-fighter="B"] { --corner:var(--corner-b); }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; color:var(--fg);
    font:13px/1.5 var(--mono);
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
    background:
      radial-gradient(900px 420px at 50% -10%, color-mix(in srgb, var(--corner) 14%, transparent), transparent 60%),
      repeating-linear-gradient(115deg, rgba(255,255,255,.012) 0 2px, transparent 2px 26px),
      var(--bg);
  }
  :focus-visible { outline:2px solid var(--corner); outline-offset:2px; }

  header {
    display:flex; align-items:center; gap:16px; padding:10px 18px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, var(--panel), var(--steel)); flex:none;
  }
  .brand {
    font-family:var(--display); font-style:italic; font-size:24px; line-height:1;
    text-transform:uppercase; letter-spacing:.02em; color:var(--corner-a);
  }
  .brand em { color:var(--corner-b); font-style:italic; }
  .badge {
    font-family:var(--display); font-style:italic; font-size:16px; line-height:1;
    text-transform:uppercase; letter-spacing:.04em;
    color:var(--bg); background:var(--corner); padding:6px 14px; transform:skewX(-12deg);
  }
  .status { display:flex; align-items:center; gap:7px; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--dim); }
  .dot.live { background:var(--live); box-shadow:0 0 10px var(--live); animation:blink 1.6s infinite; }
  @keyframes blink { 50% { opacity:.25; } }
  header .spacer { flex:1; }

  .stage {
    flex:1; min-height:0; display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:14px 16px;
  }
  .pane {
    position:relative; background:#000; border:1px solid var(--line);
    overflow:hidden; display:flex;
  }
  .pane video { width:100%; height:100%; object-fit:contain; background:#000; }
  .pane .tag {
    position:absolute; top:12px; left:14px; z-index:2;
    font:700 10px/1 var(--mono); letter-spacing:.16em; text-transform:uppercase; color:var(--dim);
    background:rgba(8,10,15,.85); border:1px solid var(--line); padding:6px 10px;
    transform:skewX(-12deg);
  }
  .pane.robot { clip-path:polygon(0 0, 100% 0, 100% calc(100% - 22px), calc(100% - 22px) 100%, 0 100%); }
  .pane.robot::before {
    content:""; position:absolute; top:0; left:0; right:0; height:3px; z-index:2;
    background:linear-gradient(90deg, var(--corner), transparent 75%);
  }
  .pane.robot .tag { color:var(--corner); border-left:3px solid var(--corner); }

  .controls {
    display:flex; align-items:center; gap:10px; padding:12px 16px; flex-wrap:wrap;
    border-top:1px solid var(--line);
    background:linear-gradient(0deg, var(--panel), var(--steel)); flex:none;
  }
  .controls label.inline { font-size:11px; color:var(--dim); display:flex; align-items:center; gap:6px; }
  .controls input[type="checkbox"] { accent-color:var(--corner); }
  select {
    font:12px var(--mono); background:var(--steel); color:var(--fg); border:1px solid var(--line);
    padding:10px; max-width:230px; letter-spacing:.04em;
  }
  .drop {
    display:flex; align-items:center; gap:8px; border:1px dashed var(--line);
    padding:6px 10px; cursor:pointer; color:var(--dim); font-size:11px; max-width:300px;
  }
  .drop:hover, .drop.over { border-color:var(--corner); color:var(--fg); }
  .drop img { width:34px; height:34px; object-fit:cover; display:none; }
  .drop img.set { display:block; }
  .gallery { display:flex; gap:6px; align-items:center; }
  .gallery img {
    width:34px; height:34px; object-fit:cover;
    border:1px solid var(--line); cursor:pointer;
  }
  .gallery img:hover { border-color:var(--corner); }
  .gallery img.sel { border-color:var(--corner); box-shadow:0 0 8px var(--corner); }
  button {
    font:700 12px/1 var(--mono); letter-spacing:.06em; text-transform:uppercase;
    padding:12px 18px; cursor:pointer;
    background:var(--steel); color:var(--fg); border:1px solid var(--line);
  }
  button:hover:not(:disabled) { border-color:var(--corner); color:var(--corner); }
  button:disabled { color:var(--dim); cursor:not-allowed; }
  #start.primary { background:var(--corner); border-color:var(--corner); color:var(--bg); }
  #start.primary:hover:not(:disabled) { filter:brightness(1.12); color:var(--bg); }
  #start.stop { background:transparent; border-color:var(--hit); color:var(--hit); }
  #record { border-left:3px solid var(--hit); }
  #record.rec { border-color:var(--hit); color:var(--hit); animation:pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity:.55; } }
  .controls .spacer { flex:1; }
  .hint { font-size:11px; color:var(--dim); letter-spacing:.04em; }

  /* Full-screen cue so the fighter can't miss the moment they must physically perform the
     reaction (CLAUDE.md constraint 7 — the prompt swap alone renders nothing convincing). */
  #hitCue {
    position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center;
    pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(255,77,77,.15), rgba(255,77,77,.45));
  }
  #hitCue.show { display:flex; animation:cueFlash 1.6s ease-out forwards; }
  #hitCue span {
    font-family:var(--display); font-style:italic; font-size:9vw; line-height:1;
    text-transform:uppercase; color:#fff; text-shadow:0 0 40px var(--hit);
    transform:skewX(-8deg);
  }
  #hitCue.reset { background:radial-gradient(ellipse at center, rgba(61,255,168,.12), rgba(61,255,168,.35)); }
  #hitCue.reset span { text-shadow:0 0 40px var(--live); }
  @keyframes cueFlash { 0%, 60% { opacity:1; } 100% { opacity:0; } }

  #log {
    flex:none; max-height:96px; overflow-y:auto; padding:6px 16px;
    font:11px/1.6 var(--mono); color:var(--dim);
    border-top:1px solid var(--line); white-space:pre-wrap;
  }
  #log .ok { color:var(--live); }
  #log .err { color:var(--hit); }

  @media (max-width:760px){ .stage{ grid-template-columns:1fr; grid-template-rows:1fr 1fr; } }
  @media (prefers-reduced-motion: reduce) {
    .dot.live, #record.rec { animation:none; }
    #hitCue.show { animation:cueFlash 1.6s step-end forwards; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">SHADOW<em>BOX</em></div>
  <div class="badge" id="fighterBadge">FIGHTER A</div>
  <div class="status"><div class="dot" id="statusDot"></div><span id="statusText">idle</span></div>
  <div class="spacer"></div>
  <span class="hint">Open one page per fighter: <code>?fighter=A</code> / <code>?fighter=B</code></span>
</header>

<div class="stage">
  <div class="pane">
    <span class="tag">You — camera</span>
    <video id="local" autoplay muted playsinline></video>
  </div>
  <div class="pane robot">
    <span class="tag">Your character — live</span>
    <video id="remote" autoplay muted playsinline></video>
  </div>
</div>

<div class="controls">
  <select id="camera"><option value="">Default camera</option></select>

  <div class="drop" id="dropZone" title="This is who you become. One image per session.">
    <img id="dropThumb" alt="">
    <span id="dropText">Drop a character image — or click (default: robot)</span>
    <input type="file" id="refFile" accept="image/*" hidden>
  </div>

  <div class="gallery" id="gallery" title="Or pick an image already in the public folder"></div>

  <label class="inline"><input type="checkbox" id="voiceMorph"> Robot voice (mic)</label>
  <select id="arena" title="X2 repaints your room as this arena. Your choice is synced to the other fighter so the split-screen reads as one venue. If your character's identity weakens, pick 'No arena' — stacked edits compete.">
    <option value="random" selected>Random arena</option>
    <option value="neon">Neon coliseum</option>
    <option value="junkyard">Wasteland junkyard</option>
    <option value="volcano">Volcano crater</option>
    <option value="glacier">Glacier field</option>
    <option value="rooftop">City rooftop</option>
    <option value="none">No arena — real room</option>
  </select>

  <div class="spacer"></div>
  <button id="record" disabled>● Record</button>
  <button id="start" class="primary" disabled>Start</button>
</div>

<div id="hitCue"><span></span></div>

<div id="log"></div>

<script type="module">
  const logEl = document.getElementById('log');
  function log(msg, cls) {
    const line = document.createElement('div');
    if (cls) line.className = cls;
    line.textContent = msg;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
    console.log(msg);
  }

  const localVideo = document.getElementById('local');
  const remoteVideo = document.getElementById('remote');
  const startBtn = document.getElementById('start');
  const recordBtn = document.getElementById('record');
  const cameraSelect = document.getElementById('camera');
  const dropZone = document.getElementById('dropZone');
  const dropThumb = document.getElementById('dropThumb');
  const dropText = document.getElementById('dropText');
  const refFileInput = document.getElementById('refFile');
  const voiceMorphChk = document.getElementById('voiceMorph');
  const arenaSelect = document.getElementById('arena');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');

  function setStatus(text, live) {
    statusText.textContent = text;
    statusDot.classList.toggle('live', !!live);
  }

  // Prompts follow https://docs.reactor.inc/model-api-reference/x2/prompt-guide.md :
  // verbatim Chinese capability prefix for character replacement, spatially-named target,
  // one preservation boundary, and no textual description of the character — the REFERENCE
  // image supplies appearance (which is what makes drop-in custom characters work: the
  // prompt is generic, the identity comes entirely from the uploaded image). Both states are
  // complete prompts; the guide forbids relative follow-ups like "now stagger".
  //
  // Arena variants: the same background-replacement structure with a different venue
  // description per key. The chosen key is relayed to the other fighter's page so both
  // sessions render the SAME venue and the split-screen broadcast reads as one arena.
  // 'none' is the guide-recommended single-edit prompt (real room kept) — the guide warns
  // stacked edits compete, so if character identity weakens, pick 'none'.
  const ARENAS = {
    neon:     '科幻格斗竞技场：深色金属地面，环形霓虹灯光，远处观众席',
    junkyard: '废土垃圾场格斗区：锈蚀金属残骸，扬尘的黄昏天空，四周堆积的废弃机械',
    volcano:  '火山口格斗台：黑色岩石地面，流动的熔岩裂缝，橙红色炽热光芒',
    glacier:  '冰川格斗场：湛蓝冰面，飘雪的极光夜空，四周耸立的冰柱',
    rooftop:  '未来都市天台擂台：夜晚霓虹摩天楼背景，雨后反光地面，探照灯光柱',
  };
  function buildPrompts(arenaKey) {
    const prefix = '视频中角色替换成参考图中角色\n';
    if (!arenaKey || arenaKey === 'none') return {
      standing:
        prefix + '仅将画面中央的人物替换为参考图角色。保留该人物的表情、视线、姿势和手部动作；背景、其他人物和镜头保持不变。',
      staggered:
        prefix + '仅将画面中央的人物替换为参考图角色。该角色刚被击中，正踉跄后退、失去平衡、防御松散，动作与画面中人物的真实动作完全一致；背景、其他人物和镜头保持不变。',
    };
    const arena = ARENAS[arenaKey];
    return {
      standing:
        prefix + '将画面中央的人物替换为参考图角色，并将背景替换为' + arena + '。保留该人物的表情、姿势和手部动作；镜头保持不变。',
      staggered:
        prefix + '将画面中央的人物替换为参考图角色，并将背景替换为' + arena + '。该角色刚被击中，正踉跄后退、失去平衡、防御松散，动作与画面中人物的真实动作完全一致；镜头保持不变。',
    };
  }
  let activePrompts = buildPrompts('none'); // rebuilt at Start from the arena select

  // Fighter id keys this session's feed on the broadcast page.
  const fighter = new URLSearchParams(location.search).get('fighter') || 'A';
  document.title = 'Shadowbox — Fighter ' + fighter;
  document.getElementById('fighterBadge').textContent = 'FIGHTER ' + fighter;
  document.body.dataset.fighter = fighter; // corner color (blue corner A / red corner B)
  if (!new URLSearchParams(location.search).get('fighter')) {
    log('No ?fighter= in URL — defaulting to Fighter A. Open the second session as ?fighter=B.', 'err');
  }

  // Default reference per fighter; a dropped image overrides it (still exactly ONE reference
  // per session — CLAUDE.md constraint 4 — just user-chosen instead of fixed).
  const DEFAULT_REFERENCE = { A: '/robot1.png', B: '/robot2.png' }[fighter];
  let customRefFile = null;

  function setCustomRef(file) {
    if (!file || !file.type.startsWith('image/')) return;
    customRefFile = file;
    dropThumb.src = URL.createObjectURL(file);
    dropThumb.classList.add('set');
    dropText.textContent = file.name + ' — applies on next Start';
    log('Custom reference selected: ' + file.name + ' (used on next Start). For public demos, prefer original designs.', 'ok');
  }
  dropZone.addEventListener('click', () => refFileInput.click());
  refFileInput.addEventListener('change', () => setCustomRef(refFileInput.files[0]));
  dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('over'));
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('over');
    setCustomRef(e.dataTransfer.files[0]);
  });

  // Gallery of images already in public/ — clicking one selects it exactly like a dropped
  // file (still exactly ONE reference per session, applied on next Start).
  const gallery = document.getElementById('gallery');
  fetch('/references').then(r => r.json()).then(files => {
    for (const name of files) {
      const img = document.createElement('img');
      img.src = '/' + name;
      img.title = name;
      img.addEventListener('click', async () => {
        const blob = await (await fetch('/' + name)).blob();
        setCustomRef(new File([blob], name, { type: blob.type }));
        for (const el of gallery.children) el.classList.toggle('sel', el === img);
      });
      gallery.appendChild(img);
    }
  }).catch(() => {});

  let pc;
  let x2Instance;          // real X2 session; undefined in mock mode
  let currentStream;       // webcam MediaStream, released on Stop
  let micStream;           // raw mic, released on Stop
  let audioCtx;            // WebAudio graph for the robot voice
  let morphedAudioTrack;   // ring-modulated mic track, pushed to broadcast + recordings
  let outputVideoTrack;    // the track shown in the "robot" pane (X2 output, or loopback in mock)
  let recorder;            // active MediaRecorder, if recording

  // Hit cue: only ever swaps the PROMPT (CLAUDE.md constraint 7 — the fighter must
  // physically perform the reaction; text alone cannot fake motion). The full-screen cue is
  // what tells the human to perform it — a log line is too easy to miss mid-fight.
  const hitCue = document.getElementById('hitCue');
  let cueTimer;
  function showCue(staggered) {
    hitCue.querySelector('span').textContent = staggered ? 'HIT — REACT!' : 'RESET — STAND UP';
    hitCue.classList.toggle('reset', !staggered);
    hitCue.classList.remove('show');
    // restart the animation even if two cues land back to back
    void hitCue.offsetWidth;
    hitCue.classList.add('show');
    clearTimeout(cueTimer);
    cueTimer = setTimeout(() => hitCue.classList.remove('show'), 1700);
  }

  async function applyHitState(staggered) {
    showCue(staggered);
    if (!x2Instance) {
      log('Hit cue received, but no live X2 session — nothing to update.', 'err');
      return;
    }
    await x2Instance.setPrompt({ prompt: activePrompts[staggered ? 'staggered' : 'standing'] });
    log((staggered ? 'Staggered' : 'Recovery') + ' prompt sent — react physically now, ~1s settling delay.', 'ok');
  }

  // Classic ring-modulator robot voice (X2 has no audio tracks at all — verified against the
  // SDK types — so "voice morph" is a local WebAudio effect on the mic, not a model feature):
  // mic -> GainNode whose gain is driven at audio rate by a ~30Hz oscillator.
  function buildVoiceMorph(mic) {
    audioCtx = new AudioContext();
    const source = audioCtx.createMediaStreamSource(mic);
    const ring = audioCtx.createGain();
    ring.gain.value = 0; // fully modulated by the oscillator
    const osc = audioCtx.createOscillator();
    osc.frequency.value = 30;
    osc.connect(ring.gain);
    osc.start();
    const dest = audioCtx.createMediaStreamDestination();
    source.connect(ring);
    ring.connect(dest);
    return dest.stream.getAudioTracks()[0];
  }

  // One relay connection for the page's whole life: hit cues and arena sync must work even
  // before a session starts; WebRTC signaling rides the same socket once publishing begins.
  // Netlify (or any static host) can't serve the WebSocket relay — pass
  // ?relay=wss://<host>/relay to point at the laptop running `npm start`.
  const relayWs = new WebSocket(new URLSearchParams(location.search).get('relay') || location.origin.replace(/^http/, 'ws') + '/relay');
  const relayReady = new Promise((resolve) => relayWs.addEventListener('open', resolve));
  relayWs.addEventListener('error', () => log('Relay connection failed (non-fatal — local view still works).', 'err'));
  relayWs.addEventListener('message', async (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'hit' && msg.target === fighter) return applyHitState(true);
    if (msg.type === 'reset' && (!msg.target || msg.target === fighter)) return applyHitState(false);
    if (msg.type === 'arena' && !running) {
      arenaSelect.value = msg.arena;
      log('Arena synced from the other fighter: ' + msg.arena + ' — same venue on both halves.', 'ok');
      return;
    }
    if (msg.fighterId !== fighter || !pc) return;
    if (msg.type === 'answer') await pc.setRemoteDescription(msg.sdp);
    if (msg.type === 'ice' && msg.from === 'broadcast') await pc.addIceCandidate(msg.candidate).catch(() => {});
  });

  // Push the rendered feed (+ morphed voice if enabled) to the broadcast page over WebRTC,
  // signalled through the server's flood relay. Composite-after-generation per CLAUDE.md.
  async function publishToBroadcast(videoTrack) {
    const outStream = new MediaStream(
      morphedAudioTrack ? [videoTrack, morphedAudioTrack] : [videoTrack]
    );
    pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
    for (const track of outStream.getTracks()) pc.addTrack(track, outStream);
    pc.onicecandidate = (e) => {
      if (e.candidate) relayWs.send(JSON.stringify({ type: 'ice', fighterId: fighter, from: 'fighter', candidate: e.candidate }));
    };
    await relayReady;
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    relayWs.send(JSON.stringify({ type: 'offer', fighterId: fighter, sdp: pc.localDescription }));
    log('Feed offered to broadcast page (' + (morphedAudioTrack ? 'video+voice' : 'video only') + ').', 'ok');
  }

  async function refreshCameraList() {
    const devices = await navigator.mediaDevices.enumerateDevices();
    const cams = devices.filter(d => d.kind === 'videoinput');
    cameraSelect.innerHTML = '<option value="">Default camera</option>' +
      cams.map((d, i) => `<option value="${d.deviceId}">${d.label || 'Camera ' + (i + 1)}</option>`).join('');
  }
  refreshCameraList().catch(() => {});

  startBtn.disabled = false;
  let running = false;

  async function startSession() {
    setStatus('starting…', false);
    // Resolve the arena for this render: 'random' rolls a fresh venue each Start, and the
    // choice is relayed so the other fighter's page adopts the same one (one venue across
    // the split-screen). The other page only adopts it while idle — a running session keeps
    // the arena it started with.
    let arenaKey = arenaSelect.value;
    if (arenaKey === 'random') {
      const keys = Object.keys(ARENAS);
      arenaKey = keys[Math.floor(Math.random() * keys.length)];
      arenaSelect.value = arenaKey;
    }
    activePrompts = buildPrompts(arenaKey);
    log('Arena: ' + (arenaKey === 'none' ? 'none (real room kept)' : arenaKey + ' (X2 repaints the room)'));
    relayReady.then(() => relayWs.send(JSON.stringify({ type: 'arena', arena: arenaKey })));
    log('Requesting webcam…');
    const deviceId = cameraSelect.value;
    const videoConstraint = deviceId ? { deviceId: { exact: deviceId } } : true;
    const stream = await navigator.mediaDevices.getUserMedia({ video: videoConstraint, audio: false });
    currentStream = stream;
    localVideo.srcObject = stream;
    await refreshCameraList().catch(() => {});

    if (voiceMorphChk.checked) {
      log('Requesting microphone for robot voice…');
      micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      morphedAudioTrack = buildVoiceMorph(micStream);
      log('Robot voice active — it is pushed to the broadcast and into recordings (your own pane stays silent to avoid feedback).', 'ok');
    }

    log('Requesting JWT from /token…');
    // Hosted deployments guard /token with a shared secret (TOKEN_SECRET on the server) —
    // fighters carry it in the page URL as ?key=... . Absent locally, absent header, no harm.
    const tokenRes = await fetch('/token', {
      method: 'POST',
      headers: { 'x-shadowbox-key': new URLSearchParams(location.search).get('key') || '' },
    });
    const tokenBody = await tokenRes.json();
    if (!tokenRes.ok) throw new Error('Token exchange failed: ' + JSON.stringify(tokenBody));

    if (tokenBody.mock) {
      log('MOCK MODE — no REACTOR_API_KEY set, no Reactor call made, no credits spent.', 'ok');
      remoteVideo.srcObject = stream;
      outputVideoTrack = stream.getVideoTracks()[0];
      publishToBroadcast(outputVideoTrack).catch((err) => log('Broadcast publish failed: ' + err.message, 'err'));
      recordBtn.disabled = false;
      setStatus('mock loopback', true);
      return;
    }

    log('Got real JWT', 'ok');

    // SDK from the locally installed npm package, bundled by `npm run build:sdk`.
    log('Importing X2 SDK…');
    const { X2Model } = await import('./vendor/x2.mjs');
    log('SDK import ok', 'ok');

    log('Connecting to X2…');
    const x2 = new X2Model();
    x2Instance = x2;

    // Subscribe BEFORE connect(): recvonly tracks are resumed immediately on connect, the
    // event does not replay, and vanilla JS has no way to read the track afterwards.
    x2.onMainVideo((track, remoteStream) => {
      log('main_video track received', 'ok');
      remoteVideo.srcObject = remoteStream;
      remoteVideo.play().catch(() => {});
      outputVideoTrack = track;
      publishToBroadcast(track).catch((err) => log('Broadcast publish failed: ' + err.message, 'err'));
      recordBtn.disabled = false;
      setStatus('live — generating', true);
    });

    x2.on('runtimeMessage', (msg) => {
      const type = msg && msg.type;
      if (type === 'state_update' || type === 'pointer_changed') return;
      try { log('model: ' + JSON.stringify(msg), type === 'command_error' ? 'err' : 'ok'); }
      catch { log('model: ' + type); }
    });

    await x2.connect(tokenBody.jwt);
    log('Connected (status: ' + x2.getStatus() + ')', 'ok');

    // publishTrack only works at status "ready" — connect() resolving only reaches "waiting".
    if (x2.getStatus() !== 'ready') {
      log('Waiting for session to reach "ready"…');
      await new Promise((resolve, reject) => {
        const timer = setTimeout(() => {
          x2.off('statusChanged', onStatus);
          reject(new Error('Timed out waiting for session "ready" (last status: ' + x2.getStatus() + ')'));
        }, 30000);
        function onStatus(status) {
          log('  status: ' + status);
          if (status === 'ready') { clearTimeout(timer); x2.off('statusChanged', onStatus); resolve(); }
          else if (status === 'disconnected') { clearTimeout(timer); x2.off('statusChanged', onStatus); reject(new Error('Session disconnected before becoming ready')); }
        }
        x2.on('statusChanged', onStatus);
      });
      log('Session ready', 'ok');
    }

    log('Publishing webcam as SOURCE…');
    await x2.publishSource(stream.getVideoTracks()[0]);
    log('Published.', 'ok');

    // One reference per session: the dropped file if any, else this fighter's default.
    let refFile = customRefFile;
    if (!refFile && DEFAULT_REFERENCE) {
      log('Fetching default reference (' + DEFAULT_REFERENCE + ')…');
      const blob = await (await fetch(DEFAULT_REFERENCE)).blob();
      refFile = new File([blob], DEFAULT_REFERENCE.slice(1), { type: blob.type });
    }
    if (refFile) {
      log('Uploading reference image (' + refFile.name + ')…');
      const ref = await x2.uploadFile(refFile);
      await x2.setReferenceImage({ reference_image: ref });
      log('Reference image set', 'ok');
    } else {
      log('No reference image — generation will follow the prompt text only.', 'err');
    }

    await x2.setPrompt({ prompt: activePrompts.standing });
    log('Prompt set. Generation begins once frames are flowing — expect ~1s settling delay.', 'ok');
    setStatus('live — waiting for first frames', true);
  }

  // Stop must actually disconnect() — X2 bills per session-second including idle.
  async function stopSession() {
    if (recorder && recorder.state !== 'inactive') recorder.stop();
    if (x2Instance) {
      log('Disconnecting X2 session (stops billing)…');
      await x2Instance.disconnect().catch((err) => log('disconnect() failed: ' + err.message, 'err'));
      x2Instance = null;
    }
    if (pc) { pc.close(); pc = null; } // relayWs stays open — hit cues and arena sync outlive sessions
    if (currentStream) { currentStream.getTracks().forEach(t => t.stop()); currentStream = null; }
    if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
    if (audioCtx) { audioCtx.close().catch(() => {}); audioCtx = null; }
    morphedAudioTrack = null;
    outputVideoTrack = null;
    localVideo.srcObject = null;
    remoteVideo.srcObject = null;
    recordBtn.disabled = true;
    setStatus('idle', false);
    log('Stopped.', 'ok');
  }

  startBtn.addEventListener('click', async () => {
    startBtn.disabled = true;
    try {
      if (!running) {
        await startSession();
        running = true;
        startBtn.textContent = 'Stop';
        startBtn.classList.remove('primary');
        startBtn.classList.add('stop');
      } else {
        await stopSession();
        running = false;
        startBtn.textContent = 'Start';
        startBtn.classList.add('primary');
        startBtn.classList.remove('stop');
      }
    } catch (err) {
      log('Failed: ' + err.message, 'err');
      if (!running) await stopSession().catch(() => {});
    } finally {
      startBtn.disabled = false;
    }
  });

  // Local recording of the rendered feed (+ morphed voice), downloadable as WebM. This is a
  // browser-side MediaRecorder — X2's own clip API produces video with no audio, and the
  // voice morph only exists locally, so recording locally is the only way voice gets in.
  recordBtn.addEventListener('click', () => {
    if (recorder && recorder.state !== 'inactive') { recorder.stop(); return; }
    if (!outputVideoTrack) { log('Nothing to record yet.', 'err'); return; }
    const tracks = morphedAudioTrack ? [outputVideoTrack, morphedAudioTrack] : [outputVideoTrack];
    const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')
      ? 'video/webm;codecs=vp9,opus' : 'video/webm';
    const chunks = [];
    recorder = new MediaRecorder(new MediaStream(tracks), { mimeType: mime });
    recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
    recorder.onstop = () => {
      const url = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
      const a = document.createElement('a');
      a.href = url;
      a.download = 'shadowbox-fighter-' + fighter + '.webm';
      a.click();
      URL.revokeObjectURL(url);
      recordBtn.textContent = '● Record';
      recordBtn.classList.remove('rec');
      log('Recording saved (shadowbox-fighter-' + fighter + '.webm).', 'ok');
    };
    recorder.start();
    recordBtn.textContent = '■ Save recording';
    recordBtn.classList.add('rec');
    log('Recording this fighter\'s feed' + (morphedAudioTrack ? ' with robot voice' : '') + '…', 'ok');
  });
</script>
</body>
</html>
