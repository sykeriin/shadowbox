<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shadowbox — Fighter</title>
<style>
  :root {
    --bg:#0a0c10; --panel:#12151b; --fg:#e8e6e0; --dim:#7c7f86; --line:#242a33;
    --hot:#4ade80; --bad:#f87171; --accent:#818cf8; --accent2:#f472b6;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; background:var(--bg); color:var(--fg);
    font:14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
  }

  header {
    display:flex; align-items:center; gap:14px; padding:10px 18px;
    border-bottom:1px solid var(--line); background:var(--panel); flex:none;
  }
  .brand { font-weight:800; letter-spacing:.14em; font-size:15px; }
  .brand em { color:var(--accent); font-style:normal; }
  .badge {
    font-size:12px; font-weight:700; letter-spacing:.08em; padding:3px 10px;
    border:1px solid var(--accent); color:var(--accent); border-radius:999px;
  }
  .status { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--dim); }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--dim); }
  .dot.live { background:var(--hot); box-shadow:0 0 8px var(--hot); }
  header .spacer { flex:1; }

  .stage {
    flex:1; min-height:0; display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:10px;
  }
  .pane {
    position:relative; background:#000; border:1px solid var(--line); border-radius:10px;
    overflow:hidden; display:flex;
  }
  .pane video { width:100%; height:100%; object-fit:contain; background:#000; }
  .pane .tag {
    position:absolute; top:10px; left:10px; z-index:2; font-size:11px; font-weight:700;
    letter-spacing:.1em; text-transform:uppercase; color:var(--dim);
    background:rgba(0,0,0,.55); padding:4px 10px; border-radius:6px;
  }
  .pane.robot .tag { color:var(--accent2); }

  .controls {
    display:flex; align-items:center; gap:10px; padding:10px 14px; flex-wrap:wrap;
    border-top:1px solid var(--line); background:var(--panel); flex:none;
  }
  .controls label.inline { font-size:12px; color:var(--dim); display:flex; align-items:center; gap:6px; }
  select {
    font:inherit; background:#0d0f13; color:var(--fg); border:1px solid var(--line);
    border-radius:8px; padding:8px 10px; max-width:220px;
  }
  .drop {
    display:flex; align-items:center; gap:8px; border:1px dashed var(--line); border-radius:8px;
    padding:6px 10px; cursor:pointer; color:var(--dim); font-size:12px; max-width:300px;
  }
  .drop:hover, .drop.over { border-color:var(--accent); color:var(--fg); }
  .drop img { width:34px; height:34px; object-fit:cover; border-radius:6px; display:none; }
  .drop img.set { display:block; }
  .gallery { display:flex; gap:6px; align-items:center; }
  .gallery img {
    width:34px; height:34px; object-fit:cover; border-radius:6px;
    border:1px solid var(--line); cursor:pointer;
  }
  .gallery img:hover { border-color:var(--accent); }
  .gallery img.sel { border-color:var(--accent); box-shadow:0 0 6px var(--accent); }
  button {
    font:inherit; font-weight:700; border-radius:8px; padding:9px 18px; cursor:pointer;
    background:transparent; color:var(--fg); border:1px solid var(--line);
  }
  button:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
  button:disabled { color:var(--dim); cursor:not-allowed; }
  #start.primary { background:var(--accent); border-color:var(--accent); color:#0a0c10; }
  #start.primary:hover:not(:disabled) { filter:brightness(1.12); color:#0a0c10; }
  #start.stop { background:transparent; border-color:var(--bad); color:var(--bad); }
  #record.rec { border-color:var(--bad); color:var(--bad); animation:pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity:.55; } }
  .controls .spacer { flex:1; }
  .hint { font-size:11px; color:var(--dim); }

  #log {
    flex:none; max-height:96px; overflow-y:auto; padding:6px 14px;
    font:11px/1.6 ui-monospace, Menlo, monospace; color:var(--dim);
    border-top:1px solid var(--line); white-space:pre-wrap;
  }
  #log .ok { color:var(--hot); }
  #log .err { color:var(--bad); }

  @media (max-width:760px){ .stage{ grid-template-columns:1fr; grid-template-rows:1fr 1fr; } }
</style>
</head>
<body>
<header>
  <div class="brand">SHADOW<em>BOX</em></div>
  <div class="badge" id="fighterBadge">FIGHTER A</div>
  <div class="status"><div class="dot" id="statusDot"></div><span id="statusText">idle</span></div>
  <div class="spacer"></div>
  <span class="hint">Open one page per fighter: <code>?fighter=A</code> / <code>?fighter=B</code></span>
</header>

<div class="stage">
  <div class="pane">
    <span class="tag">You — camera</span>
    <video id="local" autoplay muted playsinline></video>
  </div>
  <div class="pane robot">
    <span class="tag">Your character — live</span>
    <video id="remote" autoplay muted playsinline></video>
  </div>
</div>

<div class="controls">
  <select id="camera"><option value="">Default camera</option></select>

  <div class="drop" id="dropZone" title="This is who you become. One image per session.">
    <img id="dropThumb" alt="">
    <span id="dropText">Drop a character image — or click (default: robot)</span>
    <input type="file" id="refFile" accept="image/*" hidden>
  </div>

  <div class="gallery" id="gallery" title="Or pick an image already in the public folder"></div>

  <label class="inline"><input type="checkbox" id="voiceMorph"> Robot voice (mic)</label>
  <label class="inline" title="X2 repaints your room as a fight arena. Same arena text on both fighters so the split-screen reads as one venue. If your character's identity weakens, turn this off — stacked edits compete."><input type="checkbox" id="arenaBg" checked> Arena background</label>

  <div class="spacer"></div>
  <button id="record" disabled>● Record</button>
  <button id="start" class="primary" disabled>Start</button>
</div>

<div id="log"></div>

<script type="module">
  const logEl = document.getElementById('log');
  function log(msg, cls) {
    const line = document.createElement('div');
    if (cls) line.className = cls;
    line.textContent = msg;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
    console.log(msg);
  }

  const localVideo = document.getElementById('local');
  const remoteVideo = document.getElementById('remote');
  const startBtn = document.getElementById('start');
  const recordBtn = document.getElementById('record');
  const cameraSelect = document.getElementById('camera');
  const dropZone = document.getElementById('dropZone');
  const dropThumb = document.getElementById('dropThumb');
  const dropText = document.getElementById('dropText');
  const refFileInput = document.getElementById('refFile');
  const voiceMorphChk = document.getElementById('voiceMorph');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');

  function setStatus(text, live) {
    statusText.textContent = text;
    statusDot.classList.toggle('live', !!live);
  }

  // Prompts follow https://docs.reactor.inc/model-api-reference/x2/prompt-guide.md :
  // verbatim Chinese capability prefix for character replacement, spatially-named target,
  // one preservation boundary, and no textual description of the character — the REFERENCE
  // image supplies appearance (which is what makes drop-in custom characters work: the
  // prompt is generic, the identity comes entirely from the uploaded image). Both states are
  // complete prompts; the guide forbids relative follow-ups like "now stagger".
  // Two background modes. "preserve" is the guide-recommended single-edit prompt. "arena"
  // stacks a background replacement on top — the guide warns stacked edits compete, so if
  // character identity weakens, the toggle turns it off. The arena text is IDENTICAL for
  // both fighters so the side-by-side broadcast reads as one venue.
  const PROMPTS = {
    preserve: {
      standing:
        '视频中角色替换成参考图中角色\n' +
        '仅将画面中央的人物替换为参考图角色。保留该人物的表情、视线、姿势和手部动作；背景、其他人物和镜头保持不变。',
      staggered:
        '视频中角色替换成参考图中角色\n' +
        '仅将画面中央的人物替换为参考图角色。该角色刚被击中，正踉跄后退、失去平衡、防御松散，动作与画面中人物的真实动作完全一致；背景、其他人物和镜头保持不变。',
    },
    arena: {
      standing:
        '视频中角色替换成参考图中角色\n' +
        '将画面中央的人物替换为参考图角色，并将背景替换为科幻格斗竞技场：深色金属地面，环形霓虹灯光，远处观众席。保留该人物的表情、姿势和手部动作；镜头保持不变。',
      staggered:
        '视频中角色替换成参考图中角色\n' +
        '将画面中央的人物替换为参考图角色，并将背景替换为科幻格斗竞技场：深色金属地面，环形霓虹灯光，远处观众席。该角色刚被击中，正踉跄后退、失去平衡、防御松散，动作与画面中人物的真实动作完全一致；镜头保持不变。',
    },
  };
  let promptMode = 'arena'; // read from the checkbox at Start

  // Fighter id keys this session's feed on the broadcast page.
  const fighter = new URLSearchParams(location.search).get('fighter') || 'A';
  document.title = 'Shadowbox — Fighter ' + fighter;
  document.getElementById('fighterBadge').textContent = 'FIGHTER ' + fighter;
  if (!new URLSearchParams(location.search).get('fighter')) {
    log('No ?fighter= in URL — defaulting to Fighter A. Open the second session as ?fighter=B.', 'err');
  }

  // Default reference per fighter; a dropped image overrides it (still exactly ONE reference
  // per session — CLAUDE.md constraint 4 — just user-chosen instead of fixed).
  const DEFAULT_REFERENCE = { A: '/robot1.png', B: '/robot2.png' }[fighter];
  let customRefFile = null;

  function setCustomRef(file) {
    if (!file || !file.type.startsWith('image/')) return;
    customRefFile = file;
    dropThumb.src = URL.createObjectURL(file);
    dropThumb.classList.add('set');
    dropText.textContent = file.name + ' — applies on next Start';
    log('Custom reference selected: ' + file.name + ' (used on next Start). For public demos, prefer original designs.', 'ok');
  }
  dropZone.addEventListener('click', () => refFileInput.click());
  refFileInput.addEventListener('change', () => setCustomRef(refFileInput.files[0]));
  dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('over'));
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('over');
    setCustomRef(e.dataTransfer.files[0]);
  });

  // Gallery of images already in public/ — clicking one selects it exactly like a dropped
  // file (still exactly ONE reference per session, applied on next Start).
  const gallery = document.getElementById('gallery');
  fetch('/references').then(r => r.json()).then(files => {
    for (const name of files) {
      const img = document.createElement('img');
      img.src = '/' + name;
      img.title = name;
      img.addEventListener('click', async () => {
        const blob = await (await fetch('/' + name)).blob();
        setCustomRef(new File([blob], name, { type: blob.type }));
        for (const el of gallery.children) el.classList.toggle('sel', el === img);
      });
      gallery.appendChild(img);
    }
  }).catch(() => {});

  let relayWs;
  let pc;
  let x2Instance;          // real X2 session; undefined in mock mode
  let currentStream;       // webcam MediaStream, released on Stop
  let micStream;           // raw mic, released on Stop
  let audioCtx;            // WebAudio graph for the robot voice
  let morphedAudioTrack;   // ring-modulated mic track, pushed to broadcast + recordings
  let outputVideoTrack;    // the track shown in the "robot" pane (X2 output, or loopback in mock)
  let recorder;            // active MediaRecorder, if recording

  // Hit cue: only ever swaps the PROMPT (CLAUDE.md constraint 7 — the fighter must
  // physically perform the reaction; text alone cannot fake motion).
  async function applyHitState(staggered) {
    if (!x2Instance) {
      log('Hit cue received (mock mode — no real X2 session, prompt not sent).', 'err');
      return;
    }
    await x2Instance.setPrompt({ prompt: PROMPTS[promptMode][staggered ? 'staggered' : 'standing'] });
    log((staggered ? 'Staggered' : 'Recovery') + ' prompt sent — react physically now, ~1s settling delay.', 'ok');
  }

  // Classic ring-modulator robot voice (X2 has no audio tracks at all — verified against the
  // SDK types — so "voice morph" is a local WebAudio effect on the mic, not a model feature):
  // mic -> GainNode whose gain is driven at audio rate by a ~30Hz oscillator.
  function buildVoiceMorph(mic) {
    audioCtx = new AudioContext();
    const source = audioCtx.createMediaStreamSource(mic);
    const ring = audioCtx.createGain();
    ring.gain.value = 0; // fully modulated by the oscillator
    const osc = audioCtx.createOscillator();
    osc.frequency.value = 30;
    osc.connect(ring.gain);
    osc.start();
    const dest = audioCtx.createMediaStreamDestination();
    source.connect(ring);
    ring.connect(dest);
    return dest.stream.getAudioTracks()[0];
  }

  // Push the rendered feed (+ morphed voice if enabled) to the broadcast page over WebRTC,
  // signalled through the server's flood relay. Composite-after-generation per CLAUDE.md.
  function publishToBroadcast(videoTrack) {
    const outStream = new MediaStream(
      morphedAudioTrack ? [videoTrack, morphedAudioTrack] : [videoTrack]
    );
    relayWs = new WebSocket(location.origin.replace(/^http/, 'ws') + '/relay');
    pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
    for (const track of outStream.getTracks()) pc.addTrack(track, outStream);
    pc.onicecandidate = (e) => {
      if (e.candidate) relayWs.send(JSON.stringify({ type: 'ice', fighterId: fighter, from: 'fighter', candidate: e.candidate }));
    };
    relayWs.addEventListener('open', async () => {
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      relayWs.send(JSON.stringify({ type: 'offer', fighterId: fighter, sdp: pc.localDescription }));
      log('Feed offered to broadcast page (' + (morphedAudioTrack ? 'video+voice' : 'video only') + ').', 'ok');
    });
    relayWs.addEventListener('message', async (ev) => {
      const msg = JSON.parse(ev.data);
      if (msg.type === 'hit' && msg.target === fighter) return applyHitState(true);
      if (msg.type === 'reset' && (!msg.target || msg.target === fighter)) return applyHitState(false);
      if (msg.fighterId !== fighter) return;
      if (msg.type === 'answer') await pc.setRemoteDescription(msg.sdp);
      if (msg.type === 'ice' && msg.from === 'broadcast') await pc.addIceCandidate(msg.candidate).catch(() => {});
    });
    relayWs.addEventListener('error', () => log('Broadcast relay connection failed (non-fatal — local view still works).', 'err'));
  }

  async function refreshCameraList() {
    const devices = await navigator.mediaDevices.enumerateDevices();
    const cams = devices.filter(d => d.kind === 'videoinput');
    cameraSelect.innerHTML = '<option value="">Default camera</option>' +
      cams.map((d, i) => `<option value="${d.deviceId}">${d.label || 'Camera ' + (i + 1)}</option>`).join('');
  }
  refreshCameraList().catch(() => {});

  startBtn.disabled = false;
  let running = false;

  async function startSession() {
    setStatus('starting…', false);
    promptMode = document.getElementById('arenaBg').checked ? 'arena' : 'preserve';
    log('Background mode: ' + (promptMode === 'arena' ? 'arena (X2 repaints the room)' : 'preserve (real room kept)'));
    log('Requesting webcam…');
    const deviceId = cameraSelect.value;
    const videoConstraint = deviceId ? { deviceId: { exact: deviceId } } : true;
    const stream = await navigator.mediaDevices.getUserMedia({ video: videoConstraint, audio: false });
    currentStream = stream;
    localVideo.srcObject = stream;
    await refreshCameraList().catch(() => {});

    if (voiceMorphChk.checked) {
      log('Requesting microphone for robot voice…');
      micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      morphedAudioTrack = buildVoiceMorph(micStream);
      log('Robot voice active — it is pushed to the broadcast and into recordings (your own pane stays silent to avoid feedback).', 'ok');
    }

    log('Requesting JWT from /token…');
    const tokenRes = await fetch('/token', { method: 'POST' });
    const tokenBody = await tokenRes.json();
    if (!tokenRes.ok) throw new Error('Token exchange failed: ' + JSON.stringify(tokenBody));

    if (tokenBody.mock) {
      log('MOCK MODE — no REACTOR_API_KEY set, no Reactor call made, no credits spent.', 'ok');
      remoteVideo.srcObject = stream;
      outputVideoTrack = stream.getVideoTracks()[0];
      publishToBroadcast(outputVideoTrack);
      recordBtn.disabled = false;
      setStatus('mock loopback', true);
      return;
    }

    log('Got real JWT', 'ok');

    // SDK from the locally installed npm package, bundled by `npm run build:sdk`.
    log('Importing X2 SDK…');
    const { X2Model } = await import('./vendor/x2.mjs');
    log('SDK import ok', 'ok');

    log('Connecting to X2…');
    const x2 = new X2Model();
    x2Instance = x2;

    // Subscribe BEFORE connect(): recvonly tracks are resumed immediately on connect, the
    // event does not replay, and vanilla JS has no way to read the track afterwards.
    x2.onMainVideo((track, remoteStream) => {
      log('main_video track received', 'ok');
      remoteVideo.srcObject = remoteStream;
      remoteVideo.play().catch(() => {});
      outputVideoTrack = track;
      publishToBroadcast(track);
      recordBtn.disabled = false;
      setStatus('live — generating', true);
    });

    x2.on('runtimeMessage', (msg) => {
      const type = msg && msg.type;
      if (type === 'state_update' || type === 'pointer_changed') return;
      try { log('model: ' + JSON.stringify(msg), type === 'command_error' ? 'err' : 'ok'); }
      catch { log('model: ' + type); }
    });

    await x2.connect(tokenBody.jwt);
    log('Connected (status: ' + x2.getStatus() + ')', 'ok');

    // publishTrack only works at status "ready" — connect() resolving only reaches "waiting".
    if (x2.getStatus() !== 'ready') {
      log('Waiting for session to reach "ready"…');
      await new Promise((resolve, reject) => {
        const timer = setTimeout(() => {
          x2.off('statusChanged', onStatus);
          reject(new Error('Timed out waiting for session "ready" (last status: ' + x2.getStatus() + ')'));
        }, 30000);
        function onStatus(status) {
          log('  status: ' + status);
          if (status === 'ready') { clearTimeout(timer); x2.off('statusChanged', onStatus); resolve(); }
          else if (status === 'disconnected') { clearTimeout(timer); x2.off('statusChanged', onStatus); reject(new Error('Session disconnected before becoming ready')); }
        }
        x2.on('statusChanged', onStatus);
      });
      log('Session ready', 'ok');
    }

    log('Publishing webcam as SOURCE…');
    await x2.publishSource(stream.getVideoTracks()[0]);
    log('Published.', 'ok');

    // One reference per session: the dropped file if any, else this fighter's default.
    let refFile = customRefFile;
    if (!refFile && DEFAULT_REFERENCE) {
      log('Fetching default reference (' + DEFAULT_REFERENCE + ')…');
      const blob = await (await fetch(DEFAULT_REFERENCE)).blob();
      refFile = new File([blob], DEFAULT_REFERENCE.slice(1), { type: blob.type });
    }
    if (refFile) {
      log('Uploading reference image (' + refFile.name + ')…');
      const ref = await x2.uploadFile(refFile);
      await x2.setReferenceImage({ reference_image: ref });
      log('Reference image set', 'ok');
    } else {
      log('No reference image — generation will follow the prompt text only.', 'err');
    }

    await x2.setPrompt({ prompt: PROMPTS[promptMode].standing });
    log('Prompt set. Generation begins once frames are flowing — expect ~1s settling delay.', 'ok');
    setStatus('live — waiting for first frames', true);
  }

  // Stop must actually disconnect() — X2 bills per session-second including idle.
  async function stopSession() {
    if (recorder && recorder.state !== 'inactive') recorder.stop();
    if (x2Instance) {
      log('Disconnecting X2 session (stops billing)…');
      await x2Instance.disconnect().catch((err) => log('disconnect() failed: ' + err.message, 'err'));
      x2Instance = null;
    }
    if (pc) { pc.close(); pc = null; }
    if (relayWs) { relayWs.close(); relayWs = null; }
    if (currentStream) { currentStream.getTracks().forEach(t => t.stop()); currentStream = null; }
    if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
    if (audioCtx) { audioCtx.close().catch(() => {}); audioCtx = null; }
    morphedAudioTrack = null;
    outputVideoTrack = null;
    localVideo.srcObject = null;
    remoteVideo.srcObject = null;
    recordBtn.disabled = true;
    setStatus('idle', false);
    log('Stopped.', 'ok');
  }

  startBtn.addEventListener('click', async () => {
    startBtn.disabled = true;
    try {
      if (!running) {
        await startSession();
        running = true;
        startBtn.textContent = 'Stop';
        startBtn.classList.remove('primary');
        startBtn.classList.add('stop');
      } else {
        await stopSession();
        running = false;
        startBtn.textContent = 'Start';
        startBtn.classList.add('primary');
        startBtn.classList.remove('stop');
      }
    } catch (err) {
      log('Failed: ' + err.message, 'err');
      if (!running) await stopSession().catch(() => {});
    } finally {
      startBtn.disabled = false;
    }
  });

  // Local recording of the rendered feed (+ morphed voice), downloadable as WebM. This is a
  // browser-side MediaRecorder — X2's own clip API produces video with no audio, and the
  // voice morph only exists locally, so recording locally is the only way voice gets in.
  recordBtn.addEventListener('click', () => {
    if (recorder && recorder.state !== 'inactive') { recorder.stop(); return; }
    if (!outputVideoTrack) { log('Nothing to record yet.', 'err'); return; }
    const tracks = morphedAudioTrack ? [outputVideoTrack, morphedAudioTrack] : [outputVideoTrack];
    const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')
      ? 'video/webm;codecs=vp9,opus' : 'video/webm';
    const chunks = [];
    recorder = new MediaRecorder(new MediaStream(tracks), { mimeType: mime });
    recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
    recorder.onstop = () => {
      const url = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
      const a = document.createElement('a');
      a.href = url;
      a.download = 'shadowbox-fighter-' + fighter + '.webm';
      a.click();
      URL.revokeObjectURL(url);
      recordBtn.textContent = '● Record';
      recordBtn.classList.remove('rec');
      log('Recording saved (shadowbox-fighter-' + fighter + '.webm).', 'ok');
    };
    recorder.start();
    recordBtn.textContent = '■ Save recording';
    recordBtn.classList.add('rec');
    log('Recording this fighter\'s feed' + (morphedAudioTrack ? ' with robot voice' : '') + '…', 'ok');
  });
</script>
</body>
</html>
