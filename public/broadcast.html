<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shadowbox — Broadcast</title>
<style>
  /* Two-corner fight-broadcast language: Fighter A owns the blue corner, Fighter B the red
     corner, and every accent on the page derives from whichever fighter it belongs to.
     Display face is the condensed-heavy-italic of fight cards (Impact stack — no webfont, so
     a LAN demo with no internet still renders it); mono is the utility/telemetry face. */
  :root {
    --bg:#05060a; --steel:#0d1017; --panel:#131824; --fg:#eef1f6; --dim:#7d8698; --line:#242c3c;
    --corner-a:#3fc1ff; --corner-b:#ff3d6e; --live:#3dffa8; --hit:#ff4d4d;
    --display: Impact, Haettenschweiler, "Franklin Gothic Medium", "Arial Narrow Bold", sans-serif;
    --mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; color:var(--fg);
    font:13px/1.5 var(--mono);
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
    background:
      radial-gradient(900px 420px at 8% -8%, rgba(63,193,255,.16), transparent 60%),
      radial-gradient(900px 420px at 92% -8%, rgba(255,61,110,.15), transparent 60%),
      repeating-linear-gradient(115deg, rgba(255,255,255,.012) 0 2px, transparent 2px 26px),
      var(--bg);
  }
  :focus-visible { outline:2px solid var(--fg); outline-offset:2px; }

  header {
    display:flex; align-items:center; gap:16px; padding:10px 18px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, var(--panel), var(--steel)); flex:none;
  }
  .brand {
    font-family:var(--display); font-style:italic; font-size:24px; line-height:1;
    text-transform:uppercase; letter-spacing:.02em; color:var(--corner-a);
  }
  .brand em { color:var(--corner-b); font-style:italic; }
  .bug {
    display:flex; align-items:center; gap:8px;
    font:700 11px/1 var(--mono); letter-spacing:.22em; text-transform:uppercase;
    color:#ffb3c2; background:rgba(255,61,110,.12); border:1px solid rgba(255,61,110,.45);
    padding:6px 10px;
  }
  .bug .bdot { width:8px; height:8px; border-radius:50%; background:var(--hit); box-shadow:0 0 10px var(--hit); animation:blink 1.6s infinite; }
  @keyframes blink { 50% { opacity:.25; } }
  header .spacer { flex:1; }
  .hint { font-size:11px; color:var(--dim); letter-spacing:.04em; }
  .hint kbd {
    font:11px var(--mono); color:var(--fg);
    border:1px solid var(--line); padding:1px 6px; background:var(--steel);
  }

  .stage { flex:1; min-height:0; position:relative; display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:14px 16px; }
  .pane { position:relative; background:#000; border:1px solid var(--line); overflow:hidden; display:flex; }
  .pane video { width:100%; height:100%; object-fit:cover; background:#000; }
  /* Corner-colored top edge sweeping in from each fighter's own (outer) side, and a chamfer
     on each outer bottom corner. */
  .pane::before { content:""; position:absolute; top:0; left:0; right:0; height:3px; z-index:2; }
  .pane[data-fighter="A"] { clip-path:polygon(0 0, 100% 0, 100% 100%, 22px 100%, 0 calc(100% - 22px)); }
  .pane[data-fighter="A"]::before { background:linear-gradient(90deg, var(--corner-a), transparent 75%); }
  .pane[data-fighter="B"] { clip-path:polygon(0 0, 100% 0, 100% calc(100% - 22px), calc(100% - 22px) 100%, 0 100%); }
  .pane[data-fighter="B"]::before { background:linear-gradient(270deg, var(--corner-b), transparent 75%); }

  /* Lower-third name plates, skewed like broadcast fight cards. */
  .plate {
    position:absolute; bottom:18px; z-index:3; display:flex; align-items:center; gap:10px;
    padding:8px 18px; background:rgba(8,10,15,.85); border:1px solid var(--line);
    transform:skewX(-12deg); white-space:nowrap;
  }
  .plate > * { transform:skewX(12deg); }
  .pane[data-fighter="A"] .plate { left:20px; border-left:3px solid var(--corner-a); }
  .pane[data-fighter="B"] .plate { right:20px; border-right:3px solid var(--corner-b); }
  .plate .name { font-family:var(--display); font-style:italic; text-transform:uppercase; font-size:19px; line-height:1; letter-spacing:.04em; }
  .pane[data-fighter="A"] .name { color:var(--corner-a); }
  .pane[data-fighter="B"] .name { color:var(--corner-b); }
  .plate .dot { width:9px; height:9px; border-radius:50%; background:var(--dim); flex:none; }
  .plate .dot.live { background:var(--live); box-shadow:0 0 10px var(--live); animation:blink 1.6s infinite; }
  .plate .state { color:var(--dim); font-size:11px; letter-spacing:.1em; text-transform:uppercase; }

  /* The signature: a slanted seam splitting the frame — blue corner bleeding in from the
     top, red corner out the bottom — with the VS plate riding it at center. */
  .seam { position:absolute; top:0; bottom:0; left:50%; width:0; z-index:4; pointer-events:none; }
  .seam::before {
    content:""; position:absolute; top:0; bottom:0; left:-1px; width:2px;
    background:linear-gradient(180deg, transparent, var(--corner-a) 20%, #fff 50%, var(--corner-b) 80%, transparent);
    transform:skewX(-12deg); box-shadow:0 0 18px rgba(255,255,255,.25);
  }
  .vs {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) skewX(-12deg); z-index:5;
    font-family:var(--display); font-style:italic; font-size:30px; line-height:1;
    padding:12px 18px 10px; color:var(--fg);
    background:linear-gradient(135deg, #161b27, #0a0d14); border:1px solid var(--line);
    box-shadow:0 0 30px rgba(63,193,255,.25), 0 0 60px rgba(255,61,110,.2);
    pointer-events:none;
  }

  /* Cosmetic hit sting only — fires instantly on the manual cue, purely visual, never touches
     X2's prompt/state. The real staggered look still depends on the fighter physically
     reacting; this is just an immediate broadcast-graphic-style flash (plus a camera shake)
     so the moment reads before that ~1s settling delay lands. */
  .pane.hit-flash { animation: hitFlash 300ms ease-out, hitShake 280ms linear; }
  @keyframes hitFlash {
    0%   { box-shadow: inset 0 0 0 9999px rgba(255,77,77,.55); }
    100% { box-shadow: inset 0 0 0 9999px rgba(255,77,77,0); }
  }
  @keyframes hitShake {
    0%, 100% { transform:translate(0,0); }
    20% { transform:translate(-6px,3px); }
    40% { transform:translate(5px,-3px); }
    60% { transform:translate(-4px,2px); }
    80% { transform:translate(3px,-1px); }
  }

  .controls {
    display:flex; align-items:center; gap:10px; padding:12px 16px; flex-wrap:wrap;
    border-top:1px solid var(--line);
    background:linear-gradient(0deg, var(--panel), var(--steel)); flex:none;
  }
  button {
    font:700 12px/1 var(--mono); letter-spacing:.06em; text-transform:uppercase;
    padding:12px 18px; cursor:pointer;
    background:var(--steel); color:var(--fg); border:1px solid var(--line);
  }
  button:hover { border-color:var(--fg); }
  button kbd { color:var(--dim); font-weight:400; }
  #hit-A { border-left:3px solid var(--corner-a); }
  #hit-A:hover { border-color:var(--corner-a); color:var(--corner-a); }
  #hit-B { border-left:3px solid var(--corner-b); }
  #hit-B:hover { border-color:var(--corner-b); color:var(--corner-b); }
  #reset:hover { border-color:var(--live); color:var(--live); }
  .controls .spacer { flex:1; }
  #record { border-left:3px solid var(--hit); }
  #record.rec { border-color:var(--hit); color:var(--hit); animation:pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity:.55; } }

  #log {
    flex:none; max-height:96px; overflow-y:auto; padding:6px 16px;
    font:11px/1.6 var(--mono); color:var(--dim);
    border-top:1px solid var(--line); white-space:pre-wrap;
  }
  #log .ok { color:var(--live); }
  #log .err { color:var(--hit); }

  @media (prefers-reduced-motion: reduce) {
    .pane.hit-flash { animation: hitFlash 300ms ease-out; }
    .bug .bdot, .plate .dot.live { animation:none; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">SHADOW<em>BOX</em></div>
  <div class="bug"><span class="bdot"></span>LIVE</div>
  <div class="spacer"></div>
  <span class="hint">Hit cues: <kbd>1</kbd> A lands · <kbd>2</kbd> B lands · <kbd>r</kbd> reset</span>
</header>

<div class="stage">
  <div class="pane" data-fighter="A">
    <!-- muted: fighter streams may carry robot-voice audio; it must never play in the venue
         (feedback). Audio is routed only into the broadcast recording mix. -->
    <video id="video-A" autoplay muted playsinline></video>
    <div class="plate"><span class="dot" id="dot-A"></span><span class="name">Fighter A</span><span class="state" id="state-A">waiting…</span></div>
  </div>
  <div class="pane" data-fighter="B">
    <video id="video-B" autoplay muted playsinline></video>
    <div class="plate"><span class="dot" id="dot-B"></span><span class="name">Fighter B</span><span class="state" id="state-B">waiting…</span></div>
  </div>
  <div class="seam"></div>
  <div class="vs">VS</div>
</div>

<div class="controls">
  <button id="hit-A">A landed a hit → B staggers <kbd>(1)</kbd></button>
  <button id="hit-B">B landed a hit → A staggers <kbd>(2)</kbd></button>
  <button id="reset">Reset both to standing <kbd>(r)</kbd></button>
  <div class="spacer"></div>
  <button id="record">● Record broadcast</button>
</div>

<div id="log"></div>

<script type="module">
  const logEl = document.getElementById('log');
  function log(msg, cls) {
    const line = document.createElement('div');
    if (cls) line.className = cls;
    line.textContent = msg;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
    console.log(msg);
  }

  // Two independent RTCPeerConnections, one per fighterId — this is the "composite after
  // generation, not before" from CLAUDE.md constraint 3: each feed is a finished X2 output
  // received separately and just placed in its own half of the screen via CSS grid. No
  // frame-level merging happens anywhere.
  const peers = {};   // fighterId -> RTCPeerConnection
  const streams = {}; // fighterId -> MediaStream (for the recording compositor)
  // ?relay=wss://<host>/relay overrides the same-origin relay for tunnels/local setups.
  const relayWs = new WebSocket(new URLSearchParams(location.search).get('relay') || location.origin.replace(/^http/, 'ws') + '/relay');

  function peerFor(fighterId) {
    if (peers[fighterId]) return peers[fighterId];
    const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
    pc.onicecandidate = (e) => {
      if (e.candidate) relayWs.send(JSON.stringify({ type: 'ice', fighterId, from: 'broadcast', candidate: e.candidate }));
    };
    // Diagnostic: "connected" = media flowing; stuck on "checking" or ending in "failed"
    // means signaling worked but the network blocks peer-to-peer (guest WiFi isolation).
    pc.oniceconnectionstatechange = () =>
      log('Fighter ' + fighterId + ' link: ' + pc.iceConnectionState,
          pc.iceConnectionState === 'failed' ? 'err' : (pc.iceConnectionState === 'connected' ? 'ok' : undefined));
    pc.ontrack = (e) => {
      const video = document.getElementById('video-' + fighterId);
      if (video) {
        video.srcObject = e.streams[0];
        streams[fighterId] = e.streams[0];
        document.getElementById('dot-' + fighterId)?.classList.add('live');
        const state = document.getElementById('state-' + fighterId);
        if (state) state.textContent = 'live';
        log('Fighter ' + fighterId + ' ' + e.track.kind + ' track live', 'ok');
        if (e.track.kind === 'audio') addToRecordingMix(e.track, fighterId);
      } else {
        log('Got a feed for unknown fighterId "' + fighterId + '" — only A and B have a slot on screen.', 'err');
      }
    };
    peers[fighterId] = pc;
    return pc;
  }

  // Manual hit cue (CLAUDE.md constraint #2 — keypress/call only, never automatic pose
  // detection). This does two things on trigger: (1) an instant cosmetic flash here, purely
  // visual, so the moment reads on screen right away; (2) sends {type:'hit', target} over the
  // relay so the TARGETED fighter's own page updates its X2 prompt — but that only actually
  // looks staggered once that fighter physically reacts on their own camera (constraint #7).
  function flash(fighterId) {
    const pane = document.querySelector('.pane[data-fighter="' + fighterId + '"]');
    if (!pane) return;
    pane.classList.remove('hit-flash');
    // restart the animation even if triggered twice in a row
    void pane.offsetWidth;
    pane.classList.add('hit-flash');
  }
  function sendHit(target) {
    flash(target);
    relayWs.send(JSON.stringify({ type: 'hit', target }));
    log('Hit cue sent: ' + target + ' staggers.', 'ok');
  }
  function sendReset() {
    relayWs.send(JSON.stringify({ type: 'reset' }));
    log('Reset cue sent to both fighters.', 'ok');
  }
  document.getElementById('hit-A').addEventListener('click', () => sendHit('B')); // A landed it, B reacts
  document.getElementById('hit-B').addEventListener('click', () => sendHit('A')); // B landed it, A reacts
  document.getElementById('reset').addEventListener('click', sendReset);
  window.addEventListener('keydown', (e) => {
    if (e.key === '1') sendHit('B');
    if (e.key === '2') sendHit('A');
    if (e.key === 'r') sendReset();
  });

  // Announce readiness so fighters that are ALREADY live re-offer their feeds — offers are
  // otherwise sent once at publish time, and a broadcast page that connects late or gets
  // reloaded mid-fight would wait forever.
  relayWs.addEventListener('open', () => {
    log('Connected to relay, waiting for fighter offers…', 'ok');
    relayWs.send(JSON.stringify({ type: 'broadcast-ready' }));
  });
  relayWs.addEventListener('error', () => log('Relay connection failed.', 'err'));
  relayWs.addEventListener('message', async (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'offer') {
      // A fresh offer means the fighter built a brand-new connection (session restart or a
      // re-offer for us) — a stale peer must not swallow it.
      if (peers[msg.fighterId]) { peers[msg.fighterId].close(); delete peers[msg.fighterId]; }
      const pc = peerFor(msg.fighterId);
      await pc.setRemoteDescription(msg.sdp);
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      relayWs.send(JSON.stringify({ type: 'answer', fighterId: msg.fighterId, sdp: pc.localDescription }));
      log('Answered offer from Fighter ' + msg.fighterId, 'ok');
    } else if (msg.type === 'ice' && msg.from === 'fighter') {
      const pc = peers[msg.fighterId];
      if (pc) await pc.addIceCandidate(msg.candidate).catch(() => {});
    }
  });

  // ---- Broadcast recording -------------------------------------------------------------
  // 1920×1080 canvas, both received feeds contain-fit into their halves, drawn by a rAF loop
  // that only runs while recording. Audio: both fighters' robot-voice tracks are mixed with
  // WebAudio into the recording ONLY — the on-screen <video>s stay muted so nothing plays in
  // the venue. (Chrome quirk: remote WebRTC audio reaches WebAudio only when the stream is
  // attached to a media element — the muted <video>s satisfy that.) This composits two
  // finished output streams AFTER generation, same as the CSS grid — constraint 3 holds.
  const recordBtn = document.getElementById('record');
  const W = 1920, H = 1080, HALF = W / 2;
  let recorder, audioCtx, mixDest, rafId;
  const mixedTrackIds = new Set();

  function addToRecordingMix(track, fighterId) {
    if (!audioCtx || mixedTrackIds.has(track.id)) return;
    mixedTrackIds.add(track.id);
    audioCtx.createMediaStreamSource(new MediaStream([track])).connect(mixDest);
    log('Fighter ' + fighterId + ' voice added to the recording mix.', 'ok');
  }

  function drawFrame(ctx) {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    for (const [fighterId, x0] of [['A', 0], ['B', HALF]]) {
      const video = document.getElementById('video-' + fighterId);
      if (!video || !video.videoWidth) continue;
      // Cover-fit, matching the on-screen object-fit:cover — fill the half, crop the spill.
      const scale = Math.max(HALF / video.videoWidth, H / video.videoHeight);
      const sw = HALF / scale, sh = H / scale;
      const sx = (video.videoWidth - sw) / 2, sy = (video.videoHeight - sh) / 2;
      ctx.drawImage(video, sx, sy, sw, sh, x0, 0, HALF, H);
    }
  }

  recordBtn.addEventListener('click', () => {
    if (recorder && recorder.state !== 'inactive') { recorder.stop(); return; }
    if (!streams.A && !streams.B) { log('No fighter feeds yet — nothing to record.', 'err'); return; }

    const canvas = document.createElement('canvas');
    canvas.width = W;
    canvas.height = H;
    const ctx = canvas.getContext('2d');

    audioCtx = new AudioContext();
    mixDest = audioCtx.createMediaStreamDestination();
    mixedTrackIds.clear();
    for (const fighterId of ['A', 'B']) {
      for (const track of (streams[fighterId]?.getAudioTracks() || [])) addToRecordingMix(track, fighterId);
    }

    const canvasStream = canvas.captureStream(30);
    const tracks = [...canvasStream.getVideoTracks(), ...mixDest.stream.getAudioTracks()];
    const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')
      ? 'video/webm;codecs=vp9,opus' : 'video/webm';
    const chunks = [];
    recorder = new MediaRecorder(new MediaStream(tracks), { mimeType: mime });
    recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
    recorder.onstop = () => {
      cancelAnimationFrame(rafId);
      audioCtx.close().catch(() => {});
      audioCtx = null;
      const url = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
      const a = document.createElement('a');
      a.href = url;
      a.download = 'shadowbox-broadcast.webm';
      a.click();
      URL.revokeObjectURL(url);
      recordBtn.textContent = '● Record broadcast';
      recordBtn.classList.remove('rec');
      log('Broadcast recording saved (shadowbox-broadcast.webm).', 'ok');
    };

    (function loop() {
      drawFrame(ctx);
      rafId = requestAnimationFrame(loop);
    })();
    recorder.start();
    recordBtn.textContent = '■ Save recording';
    recordBtn.classList.add('rec');
    log('Recording the broadcast frame (1920×1080, both feeds + voice mix)…', 'ok');
  });
</script>
</body>
</html>
