<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shadowbox — Broadcast</title>
<style>
  :root {
    --bg:#0a0c10; --panel:#12151b; --fg:#e8e6e0; --dim:#7c7f86; --line:#242a33;
    --hot:#4ade80; --bad:#f87171; --accent:#818cf8; --accent2:#f472b6;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; color:var(--fg);
    font:14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
    background:
      radial-gradient(1200px 500px at 20% -10%, rgba(129,140,248,.14), transparent 60%),
      radial-gradient(1200px 500px at 80% -10%, rgba(244,114,182,.12), transparent 60%),
      var(--bg);
  }

  header {
    display:flex; align-items:center; gap:14px; padding:10px 18px;
    border-bottom:1px solid var(--line); background:var(--panel); flex:none;
  }
  .brand { font-weight:800; letter-spacing:.14em; font-size:15px; }
  .brand em { color:var(--accent); font-style:normal; }
  .badge {
    font-size:12px; font-weight:700; letter-spacing:.08em; padding:3px 10px;
    border:1px solid var(--accent2); color:var(--accent2); border-radius:999px;
  }
  header .spacer { flex:1; }
  .hint { font-size:11px; color:var(--dim); }
  .hint kbd {
    font:11px ui-monospace, Menlo, monospace; color:var(--fg);
    border:1px solid var(--line); border-radius:4px; padding:0 5px; background:#0d0f13;
  }

  .stage { flex:1; min-height:0; position:relative; display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:10px; }
  .pane {
    position:relative; background:#000; border:1px solid var(--line); border-radius:10px;
    overflow:hidden; display:flex;
  }
  .pane video { width:100%; height:100%; object-fit:contain; background:#000; }
  .plate {
    position:absolute; bottom:14px; left:50%; transform:translateX(-50%); z-index:2;
    display:flex; align-items:center; gap:8px;
    font-size:12px; font-weight:800; letter-spacing:.14em; text-transform:uppercase;
    background:rgba(10,12,16,.75); border:1px solid var(--line); border-radius:8px; padding:6px 14px;
    white-space:nowrap;
  }
  .pane[data-fighter="A"] .plate { border-color:var(--accent); color:var(--accent); }
  .pane[data-fighter="B"] .plate { border-color:var(--accent2); color:var(--accent2); }
  .plate .dot { width:8px; height:8px; border-radius:50%; background:var(--dim); flex:none; }
  .plate .dot.live { background:var(--hot); box-shadow:0 0 8px var(--hot); }
  .plate .state { color:var(--dim); font-weight:400; letter-spacing:.04em; text-transform:none; }

  .vs {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:3;
    width:64px; height:64px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:20px; font-weight:900; font-style:italic; letter-spacing:.05em;
    color:var(--fg); background:var(--panel); border:1px solid var(--line);
    box-shadow:0 0 24px rgba(129,140,248,.35), 0 0 48px rgba(244,114,182,.2);
    pointer-events:none;
  }

  /* Cosmetic hit sting only — fires instantly on the manual cue, purely visual, never touches
     X2's prompt/state. The real staggered look still depends on the fighter physically
     reacting; this is just an immediate broadcast-graphic-style flash so the moment reads
     before that ~1s settling delay lands. */
  .pane.hit-flash { animation: hitFlash 300ms ease-out; }
  @keyframes hitFlash {
    0%   { box-shadow: inset 0 0 0 9999px rgba(248,113,113,.55); }
    100% { box-shadow: inset 0 0 0 9999px rgba(248,113,113,0); }
  }

  .controls {
    display:flex; align-items:center; gap:10px; padding:10px 14px; flex-wrap:wrap;
    border-top:1px solid var(--line); background:var(--panel); flex:none;
  }
  button {
    font:inherit; font-weight:700; border-radius:8px; padding:9px 18px; cursor:pointer;
    background:transparent; color:var(--fg); border:1px solid var(--line);
  }
  button:hover { border-color:var(--accent); color:var(--accent); }
  button kbd { color:var(--dim); font-weight:400; }
  #hit-A:hover { border-color:var(--accent); color:var(--accent); }
  #hit-B:hover { border-color:var(--accent2); color:var(--accent2); }
  #reset:hover { border-color:var(--hot); color:var(--hot); }
  .controls .spacer { flex:1; }
  #record.rec { border-color:var(--bad); color:var(--bad); animation:pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity:.55; } }

  #log {
    flex:none; max-height:96px; overflow-y:auto; padding:6px 14px;
    font:11px/1.6 ui-monospace, Menlo, monospace; color:var(--dim);
    border-top:1px solid var(--line); white-space:pre-wrap;
  }
  #log .ok { color:var(--hot); }
  #log .err { color:var(--bad); }
</style>
</head>
<body>
<header>
  <div class="brand">SHADOW<em>BOX</em></div>
  <div class="badge">LIVE BROADCAST</div>
  <div class="spacer"></div>
  <span class="hint">Hit cues: <kbd>1</kbd> A lands · <kbd>2</kbd> B lands · <kbd>r</kbd> reset</span>
</header>

<div class="stage">
  <div class="pane" data-fighter="A">
    <!-- muted: fighter streams may carry robot-voice audio; it must never play in the venue
         (feedback). Audio is routed only into the broadcast recording mix. -->
    <video id="video-A" autoplay muted playsinline></video>
    <div class="plate"><span class="dot" id="dot-A"></span>Fighter A <span class="state" id="state-A">waiting…</span></div>
  </div>
  <div class="pane" data-fighter="B">
    <video id="video-B" autoplay muted playsinline></video>
    <div class="plate"><span class="dot" id="dot-B"></span>Fighter B <span class="state" id="state-B">waiting…</span></div>
  </div>
  <div class="vs">VS</div>
</div>

<div class="controls">
  <button id="hit-A">A landed a hit → B staggers <kbd>(1)</kbd></button>
  <button id="hit-B">B landed a hit → A staggers <kbd>(2)</kbd></button>
  <button id="reset">Reset both to standing <kbd>(r)</kbd></button>
  <div class="spacer"></div>
  <button id="record">● Record broadcast</button>
</div>

<div id="log"></div>

<script type="module">
  const logEl = document.getElementById('log');
  function log(msg, cls) {
    const line = document.createElement('div');
    if (cls) line.className = cls;
    line.textContent = msg;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
    console.log(msg);
  }

  // Two independent RTCPeerConnections, one per fighterId — this is the "composite after
  // generation, not before" from CLAUDE.md constraint 3: each feed is a finished X2 output
  // received separately and just placed in its own half of the screen via CSS grid. No
  // frame-level merging happens anywhere.
  const peers = {};   // fighterId -> RTCPeerConnection
  const streams = {}; // fighterId -> MediaStream (for the recording compositor)
  const relayWs = new WebSocket(location.origin.replace(/^http/, 'ws') + '/relay');

  function peerFor(fighterId) {
    if (peers[fighterId]) return peers[fighterId];
    const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
    pc.onicecandidate = (e) => {
      if (e.candidate) relayWs.send(JSON.stringify({ type: 'ice', fighterId, from: 'broadcast', candidate: e.candidate }));
    };
    pc.ontrack = (e) => {
      const video = document.getElementById('video-' + fighterId);
      if (video) {
        video.srcObject = e.streams[0];
        streams[fighterId] = e.streams[0];
        document.getElementById('dot-' + fighterId)?.classList.add('live');
        const state = document.getElementById('state-' + fighterId);
        if (state) state.textContent = 'live';
        log('Fighter ' + fighterId + ' ' + e.track.kind + ' track live', 'ok');
        if (e.track.kind === 'audio') addToRecordingMix(e.track, fighterId);
      } else {
        log('Got a feed for unknown fighterId "' + fighterId + '" — only A and B have a slot on screen.', 'err');
      }
    };
    peers[fighterId] = pc;
    return pc;
  }

  // Manual hit cue (CLAUDE.md constraint #2 — keypress/call only, never automatic pose
  // detection). This does two things on trigger: (1) an instant cosmetic flash here, purely
  // visual, so the moment reads on screen right away; (2) sends {type:'hit', target} over the
  // relay so the TARGETED fighter's own page updates its X2 prompt — but that only actually
  // looks staggered once that fighter physically reacts on their own camera (constraint #7).
  function flash(fighterId) {
    const pane = document.querySelector('.pane[data-fighter="' + fighterId + '"]');
    if (!pane) return;
    pane.classList.remove('hit-flash');
    // restart the animation even if triggered twice in a row
    void pane.offsetWidth;
    pane.classList.add('hit-flash');
  }
  function sendHit(target) {
    flash(target);
    relayWs.send(JSON.stringify({ type: 'hit', target }));
    log('Hit cue sent: ' + target + ' staggers.', 'ok');
  }
  function sendReset() {
    relayWs.send(JSON.stringify({ type: 'reset' }));
    log('Reset cue sent to both fighters.', 'ok');
  }
  document.getElementById('hit-A').addEventListener('click', () => sendHit('B')); // A landed it, B reacts
  document.getElementById('hit-B').addEventListener('click', () => sendHit('A')); // B landed it, A reacts
  document.getElementById('reset').addEventListener('click', sendReset);
  window.addEventListener('keydown', (e) => {
    if (e.key === '1') sendHit('B');
    if (e.key === '2') sendHit('A');
    if (e.key === 'r') sendReset();
  });

  relayWs.addEventListener('open', () => log('Connected to relay, waiting for fighter offers…', 'ok'));
  relayWs.addEventListener('error', () => log('Relay connection failed.', 'err'));
  relayWs.addEventListener('message', async (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'offer') {
      const pc = peerFor(msg.fighterId);
      await pc.setRemoteDescription(msg.sdp);
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      relayWs.send(JSON.stringify({ type: 'answer', fighterId: msg.fighterId, sdp: pc.localDescription }));
      log('Answered offer from Fighter ' + msg.fighterId, 'ok');
    } else if (msg.type === 'ice' && msg.from === 'fighter') {
      const pc = peers[msg.fighterId];
      if (pc) await pc.addIceCandidate(msg.candidate).catch(() => {});
    }
  });

  // ---- Broadcast recording -------------------------------------------------------------
  // 1920×1080 canvas, both received feeds contain-fit into their halves, drawn by a rAF loop
  // that only runs while recording. Audio: both fighters' robot-voice tracks are mixed with
  // WebAudio into the recording ONLY — the on-screen <video>s stay muted so nothing plays in
  // the venue. (Chrome quirk: remote WebRTC audio reaches WebAudio only when the stream is
  // attached to a media element — the muted <video>s satisfy that.) This composits two
  // finished output streams AFTER generation, same as the CSS grid — constraint 3 holds.
  const recordBtn = document.getElementById('record');
  const W = 1920, H = 1080, HALF = W / 2;
  let recorder, audioCtx, mixDest, rafId;
  const mixedTrackIds = new Set();

  function addToRecordingMix(track, fighterId) {
    if (!audioCtx || mixedTrackIds.has(track.id)) return;
    mixedTrackIds.add(track.id);
    audioCtx.createMediaStreamSource(new MediaStream([track])).connect(mixDest);
    log('Fighter ' + fighterId + ' voice added to the recording mix.', 'ok');
  }

  function drawFrame(ctx) {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    for (const [fighterId, x0] of [['A', 0], ['B', HALF]]) {
      const video = document.getElementById('video-' + fighterId);
      if (!video || !video.videoWidth) continue;
      const scale = Math.min(HALF / video.videoWidth, H / video.videoHeight);
      const w = video.videoWidth * scale, h = video.videoHeight * scale;
      ctx.drawImage(video, x0 + (HALF - w) / 2, (H - h) / 2, w, h);
    }
  }

  recordBtn.addEventListener('click', () => {
    if (recorder && recorder.state !== 'inactive') { recorder.stop(); return; }
    if (!streams.A && !streams.B) { log('No fighter feeds yet — nothing to record.', 'err'); return; }

    const canvas = document.createElement('canvas');
    canvas.width = W;
    canvas.height = H;
    const ctx = canvas.getContext('2d');

    audioCtx = new AudioContext();
    mixDest = audioCtx.createMediaStreamDestination();
    mixedTrackIds.clear();
    for (const fighterId of ['A', 'B']) {
      for (const track of (streams[fighterId]?.getAudioTracks() || [])) addToRecordingMix(track, fighterId);
    }

    const canvasStream = canvas.captureStream(30);
    const tracks = [...canvasStream.getVideoTracks(), ...mixDest.stream.getAudioTracks()];
    const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')
      ? 'video/webm;codecs=vp9,opus' : 'video/webm';
    const chunks = [];
    recorder = new MediaRecorder(new MediaStream(tracks), { mimeType: mime });
    recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
    recorder.onstop = () => {
      cancelAnimationFrame(rafId);
      audioCtx.close().catch(() => {});
      audioCtx = null;
      const url = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
      const a = document.createElement('a');
      a.href = url;
      a.download = 'shadowbox-broadcast.webm';
      a.click();
      URL.revokeObjectURL(url);
      recordBtn.textContent = '● Record broadcast';
      recordBtn.classList.remove('rec');
      log('Broadcast recording saved (shadowbox-broadcast.webm).', 'ok');
    };

    (function loop() {
      drawFrame(ctx);
      rafId = requestAnimationFrame(loop);
    })();
    recorder.start();
    recordBtn.textContent = '■ Save recording';
    recordBtn.classList.add('rec');
    log('Recording the broadcast frame (1920×1080, both feeds + voice mix)…', 'ok');
  });
</script>
</body>
</html>
